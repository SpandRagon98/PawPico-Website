name: Deploy MewMuze to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  github-pages:
    name: Build and deploy GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify website
        run: npm test

      - name: Build static GitHub Pages site
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          NEXT_PUBLIC_DODO_CHECKOUT_URL: https://checkout.dodopayments.com/buy/pdt_0NkWDKYYlGSBLf59iNa4q
          NEXT_PUBLIC_DODO_SUPPORT_CHECKOUT_URL: ${{ vars.DODO_SUPPORT_CHECKOUT_URL }}
          NEXT_PUBLIC_DODO_MODE: live

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add public URL to the Actions summary
        run: echo "### MewMuze is live at ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"

  hostinger:
    name: Build and deploy mewmuze.com
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://mewmuze.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and verify the Hostinger static site
        run: npm run build:pages
        env:
          HOSTINGER_BUILD: "true"
          NEXT_PUBLIC_SITE_URL: https://mewmuze.com
          NEXT_PUBLIC_DODO_CHECKOUT_URL: https://checkout.dodopayments.com/buy/pdt_0NkWDKYYlGSBLf59iNa4q
          NEXT_PUBLIC_DODO_SUPPORT_CHECKOUT_URL: ${{ vars.DODO_SUPPORT_CHECKOUT_URL }}
          NEXT_PUBLIC_DODO_MODE: live

      - name: Configure the private Hostinger commerce endpoint
        env:
          MEWMUZE_DB_HOST: ${{ secrets.HOSTINGER_DB_HOST }}
          MEWMUZE_DB_NAME: ${{ secrets.HOSTINGER_DB_NAME }}
          MEWMUZE_DB_USER: ${{ secrets.HOSTINGER_DB_USER }}
          MEWMUZE_DB_PASSWORD: ${{ secrets.HOSTINGER_DB_PASSWORD }}
          MEWMUZE_DODO_WEBHOOK_SECRET: ${{ secrets.DODO_WEBHOOK_SECRET }}
          MEWMUZE_DODO_API_KEY: ${{ secrets.DODO_API_KEY }}
          MEWMUZE_DODO_MODE: live_mode
        run: |
          if [ -n "$MEWMUZE_DB_HOST" ] && [ -n "$MEWMUZE_DB_NAME" ] && [ -n "$MEWMUZE_DB_USER" ] && [ -n "$MEWMUZE_DB_PASSWORD" ] && [ -n "$MEWMUZE_DODO_WEBHOOK_SECRET" ]; then
            php -r '$c=["db_host"=>getenv("MEWMUZE_DB_HOST"),"db_name"=>getenv("MEWMUZE_DB_NAME"),"db_user"=>getenv("MEWMUZE_DB_USER"),"db_password"=>getenv("MEWMUZE_DB_PASSWORD"),"dodo_webhook_secret"=>getenv("MEWMUZE_DODO_WEBHOOK_SECRET"),"dodo_api_key"=>getenv("MEWMUZE_DODO_API_KEY"),"dodo_mode"=>getenv("MEWMUZE_DODO_MODE") ?: "test_mode"]; file_put_contents("out/api/.mewmuze-config.php", "<?php\nreturn ".var_export($c,true).";\n");'
            if [ -z "$MEWMUZE_DODO_API_KEY" ]; then
              echo "::warning::DODO_API_KEY is not set; licence activation still works, but the optional device-count display will be unavailable."
            fi
          else
            echo "::error::Production payment, webhook, or database secrets are incomplete. Refusing to publish a checkout that cannot fulfil licences."
            exit 1
          fi

      - name: Validate the Hostinger commerce endpoint
        run: |
          php -l out/api/bootstrap.php
          php -l out/api/dodo-webhook.php
          php -l out/api/purchase-status.php
          php -l out/api/license-status.php
          php -l out/api/health.php

      - name: Deploy to Hostinger over encrypted FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out/
          server-dir: ./
          log-level: minimal

      - name: Verify the production commerce endpoint
        run: curl --fail --show-error --retry 4 --retry-delay 5 https://mewmuze.com/api/health.php

      - name: Add production URL to the Actions summary
        run: echo "### MewMuze is live at https://mewmuze.com" >> "$GITHUB_STEP_SUMMARY"
